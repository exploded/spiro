<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="Browser Spirograph drawing app - multi-arm rotating epicycles that close cleanly with integer ratios.">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spiro - Spirograph Patterns</title>
	<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
	<div class="app">
		<header>
			<div class="header-row">
				<h1 class="header-title">Spiro</h1>
				<div class="spacer"></div>
				<nav class="nav">
					<a class="nav-link current" href="/">Home</a>
					<a class="nav-link" href="/about">About</a>
				</nav>
			</div>
		</header>

		<main class="layout">
			<aside class="panel" id="panel">
				<button class="panel-toggle" id="panelToggle" aria-label="Toggle controls">&#9776;</button>

				<div class="panel-section">
					<div class="row">
						<button class="btn primary" id="startBtn">Start</button>
						<button class="btn" id="pauseBtn" disabled>Pause</button>
						<button class="btn" id="clearBtn">Clear</button>
					</div>
					<div class="row">
						<button class="btn small" id="savePngBtn">Save PNG</button>
						<button class="btn small" id="resetViewBtn">Reset View</button>
					</div>
				</div>

				<div class="panel-section">
					<h3>Pattern</h3>
					<div class="control">
						<label>Input</label>
						<div class="seg" role="radiogroup" id="inputMode">
							<button data-val="ratios" class="seg-btn active" type="button">Ratios</button>
							<button data-val="teeth" class="seg-btn" type="button">Teeth</button>
						</div>
					</div>
					<div class="control" id="armCountControl">
						<label>Arms</label>
						<div class="seg" role="radiogroup" id="armCount">
							<button data-val="2" class="seg-btn active" type="button">2</button>
							<button data-val="3" class="seg-btn" type="button">3</button>
							<button data-val="4" class="seg-btn" type="button">4</button>
							<button data-val="5" class="seg-btn" type="button">5</button>
						</div>
					</div>
					<div class="control">
						<label>Visualization</label>
						<div class="seg" role="radiogroup" id="vizMode">
							<button data-val="arms" class="seg-btn active" type="button">Arms</button>
							<button data-val="wheels" class="seg-btn" type="button">Wheels</button>
							<button data-val="none" class="seg-btn" type="button">None</button>
						</div>
					</div>
					<div class="control">
						<label for="durationInput">Duration (seconds)</label>
						<input id="durationInput" type="number" min="1" max="600" step="1" value="8">
					</div>
				</div>

				<div class="panel-section" id="armsSection">
					<h3>Arms</h3>
					<div id="armRows"></div>
					<div id="gcdHint" class="gcd-hint" hidden>
						<span id="gcdHintText"></span>
						<button type="button" class="btn small" id="simplifyBtn">Simplify</button>
					</div>
				</div>

				<div class="panel-section" id="teethSection" hidden>
					<h3>Teeth</h3>
					<div class="control">
						<label for="outerTeeth">Outer ring teeth</label>
						<input id="outerTeeth" type="number" min="10" max="200" step="1" value="96">
					</div>
					<div class="control">
						<label for="innerTeeth">Inner gear teeth</label>
						<input id="innerTeeth" type="number" min="3" max="199" step="1" value="30">
					</div>
					<div class="control">
						<label>Type</label>
						<div class="seg" role="radiogroup" id="teethType">
							<button data-val="hypo" class="seg-btn active" type="button">Hypo (inside)</button>
							<button data-val="epi" class="seg-btn" type="button">Epi (outside)</button>
						</div>
					</div>
					<div class="control">
						<label>Pen offset <span id="offsetVal" class="val-inline">0.70</span></label>
						<input id="penOffset" type="range" min="0.05" max="1" step="0.05" value="0.7">
					</div>
					<div id="teethInfo" class="gcd-hint" style="background: rgba(80, 196, 255, 0.08); border-color: rgba(80, 196, 255, 0.3); color: rgba(160, 220, 255, 0.9);"></div>
				</div>

				<div class="panel-section">
					<h3>Color</h3>
					<div class="control">
						<label>Mode</label>
						<div class="seg" role="radiogroup" id="colorMode">
							<button data-val="solid" class="seg-btn" type="button">Solid</button>
							<button data-val="rainbow" class="seg-btn active" type="button">Rainbow</button>
						</div>
					</div>
					<div class="control inline">
						<label for="strokeColor">Stroke</label>
						<input id="strokeColor" type="color" value="#ffffff">
					</div>
					<div class="control inline">
						<label for="bgColor">Background</label>
						<input id="bgColor" type="color" value="#000000">
					</div>
				</div>

				<div class="panel-section">
					<h3>Audio</h3>
					<div class="control inline">
						<label for="muteToggle">Mute</label>
						<input id="muteToggle" type="checkbox" checked>
					</div>
					<div class="control">
						<label for="volumeSlider">Volume</label>
						<input id="volumeSlider" type="range" min="0" max="100" value="30">
					</div>
				</div>

				<div class="panel-section help">
					<p>Scroll to zoom &middot; drag to pan &middot; double-click to reset view.</p>
					<p>Patterns close cleanly because all rotation rates are integers.</p>
				</div>
			</aside>

			<section class="stage" id="stage">
				<canvas id="trail"></canvas>
				<canvas id="overlay"></canvas>
			</section>
		</main>
	</div>

	<script src="/static/spiro.js"></script>
</body>
</html>
